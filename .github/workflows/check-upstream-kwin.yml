name: Check CachyOS KWin metadata

on:
  workflow_dispatch:
    inputs:
      repo_variant:
        description: "CachyOS optimized repository to check"
        required: true
        default: "v3"
        type: choice
        options:
          - v3
          - v4
          - znver4
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: kwin-no-tiles-cachyos-metadata-check
  cancel-in-progress: true

jobs:
  check-cachyos:
    name: Compare selected CachyOS KWin package with local recipe
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out test branch
        uses: actions/checkout@v5
        with:
          ref: test

      - name: Read local recipe metadata
        id: local
        shell: bash
        run: |
          set -euo pipefail
          pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n 1)"
          pkgrel="$(sed -n 's/^pkgrel=//p' PKGBUILD | head -n 1)"
          [[ -n "$pkgver" && -n "$pkgrel" ]]
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"

      - name: Query the selected CachyOS repository set
        id: upstream
        shell: bash
        env:
          REPO_VARIANT: ${{ inputs.repo_variant || 'v3' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kwin-cachyos-review"
          report="$RUNNER_TEMP/kwin-cachyos-review/review-report.txt"
          echo "CachyOS KWin metadata review" > "$report"
          echo "Checked (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$report"
          echo "Repository variant: $REPO_VARIANT" >> "$report"
          echo "Source: official CachyOS repository databases queried with the CachyOS container/keyring" >> "$report"
          echo >> "$report"

          docker run --rm --user 0:0 \
            --env REPO_VARIANT="$REPO_VARIANT" \
            cachyos/cachyos:latest \
            bash -euo pipefail -c '
              case "$REPO_VARIANT" in
                v3) opt="v3"; repo_arch="x86_64_v3"; mirror="/etc/pacman.d/cachyos-v3-mirrorlist" ;;
                v4) opt="v4"; repo_arch="x86_64_v4"; mirror="/etc/pacman.d/cachyos-v4-mirrorlist" ;;
                znver4) opt="znver4"; repo_arch="x86_64_v4"; mirror="/etc/pacman.d/cachyos-v4-mirrorlist" ;;
                *) echo "::error::Unsupported repository variant."; exit 1 ;;
              esac
              config=/tmp/pacman-kwin-no-tiles.conf
              {
                printf "%s\\n" "[options]" "Architecture = $repo_arch" "SigLevel = Required DatabaseOptional" "LocalFileSigLevel = Optional" ""
                printf "[cachyos-%s]\\nInclude = %s\\n\\n" "$opt" "$mirror"
                printf "[cachyos-core-%s]\\nInclude = %s\\n\\n" "$opt" "$mirror"
                printf "[cachyos-extra-%s]\\nInclude = %s\\n\\n" "$opt" "$mirror"
                printf "%s\\n" "[cachyos]" "Include = /etc/pacman.d/cachyos-mirrorlist" "" "[core]" "Include = /etc/pacman.d/mirrorlist" "" "[extra]" "Include = /etc/pacman.d/mirrorlist"
              } > "$config"
              pacman --config "$config" -Syy --noconfirm >/dev/null
              pacman --config "$config" -Si kwin
            ' > "$RUNNER_TEMP/kwin-cachyos-review/package-info.txt"

          upstream_version="$(sed -n 's/^Version[[:space:]]*:[[:space:]]*//p' "$RUNNER_TEMP/kwin-cachyos-review/package-info.txt" | head -n 1)"
          upstream_repo="$(sed -n 's/^Repository[[:space:]]*:[[:space:]]*//p' "$RUNNER_TEMP/kwin-cachyos-review/package-info.txt" | head -n 1)"
          [[ -n "$upstream_version" && -n "$upstream_repo" ]] || {
            echo "::error::Failed to read stock KWin version/repository from CachyOS metadata."
            cat "$RUNNER_TEMP/kwin-cachyos-review/package-info.txt"
            exit 1
          }

          {
            echo "CachyOS repository: $upstream_repo"
            echo "CachyOS stock KWin version-release: $upstream_version"
            echo "Local package version-release: ${{ steps.local.outputs.pkgver }}-${{ steps.local.outputs.pkgrel }}"
            echo
            cat "$RUNNER_TEMP/kwin-cachyos-review/package-info.txt"
            echo
            echo "Note: this checks live CachyOS repository metadata, not a historical snapshot."
          } | tee -a "$report"

          echo "version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "repository=$upstream_repo" >> "$GITHUB_OUTPUT"

      - name: Summarize whether review is required
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          LOCAL_PKGVER: ${{ steps.local.outputs.pkgver }}
          LOCAL_PKGREL: ${{ steps.local.outputs.pkgrel }}
          REPO_VARIANT: ${{ inputs.repo_variant || 'v3' }}
        run: |
          set -euo pipefail
          local_version="${LOCAL_PKGVER}-${LOCAL_PKGREL}"
          if [[ "$UPSTREAM_VERSION" == "$local_version" ]]; then
            status="MATCH"
            message="Recipe metadata matches stock KWin in the selected CachyOS repository. Source checksum, patch applicability, dependencies and build environment still require review before a build."
          else
            status="REVIEW REQUIRED"
            message="CachyOS KWin is $UPSTREAM_VERSION, while the local recipe is $local_version. Review the source checksum, dependencies, patch applicability and build environment before changing or building the recipe."
          fi
          {
            echo
            echo "Status: $status"
            echo "$message"
          } | tee -a "$RUNNER_TEMP/kwin-cachyos-review/review-report.txt"
          {
            echo "## CachyOS KWin metadata check"
            echo
            echo "- Repository variant: `$REPO_VARIANT`"
            echo "- Stock KWin: `$UPSTREAM_VERSION`"
            echo "- Local recipe: `$local_version`"
            echo "- Status: **$status**"
            echo "- No package build was started."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CachyOS metadata review report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kwin-cachyos-metadata-review-${{ inputs.repo_variant || 'v3' }}
          path: ${{ runner.temp }}/kwin-cachyos-review/
          if-no-files-found: warn
          retention-days: 30
