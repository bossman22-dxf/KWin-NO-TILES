name: Validate KWin source and patch

on:
  workflow_dispatch:
    inputs:
      kwin_version:
        description: "Stable KWin version to validate"
        required: true
        type: string
        default: "6.7.5"

permissions:
  contents: read

concurrency:
  group: kwin-patch-validation-${{ inputs.kwin_version }}
  cancel-in-progress: false

jobs:
  validate-source-and-patch:
    name: Verify source and patch applicability
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed curl patch xz coreutils tar

      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Validate version input
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.kwin_version }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use numeric X.Y.Z format."
            exit 1
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify PKGBUILD source and patch checksums
        shell: bash
        env:
          KWIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # This initial workflow intentionally validates the existing 6.7.5
          # recipe only. It does not mutate PKGBUILD or publish any release.
          if [[ "$KWIN_VERSION" != "6.7.5" ]]; then
            echo "::error::Only KWin 6.7.5 is enabled for the initial validation."
            echo "Add a verified upstream checksum and recipe update before testing another version."
            exit 1
          fi

          expected_url='https://download.kde.org/stable/plasma/${pkgver}/kwin-${pkgver}.tar.xz'
          if ! grep -Fq "$expected_url" PKGBUILD; then
            echo "::error::PKGBUILD does not contain the expected official KDE source URL template: $expected_url"
            exit 1
          fi

          expected_source_sha="6baa910b732d93c48c90f9c1cc685cc93d0b8de0cdf138c24192c045bc3a48e2"
          expected_patch_sha="345e7f3a9a0a5cc553ba41ff2da98042904d7061d4a5b6138c786b5c14cdecf5"
          actual_patch_sha="$(sha256sum disable-native-tiling.patch | awk '{print $1}')"
          if [[ "$actual_patch_sha" != "$expected_patch_sha" ]]; then
            echo "::error::Patch checksum does not match PKGBUILD's reviewed checksum."
            exit 1
          fi

          grep -Fq "$expected_source_sha" PKGBUILD
          echo "Source URL: $expected_url"
          echo "Expected source SHA-256: $expected_source_sha"
          echo "Patch SHA-256: $actual_patch_sha"

      - name: Download and verify official KWin source
        shell: bash
        env:
          KWIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kwin-${KWIN_VERSION}.tar.xz"
          source_dir="$RUNNER_TEMP/kwin-source"
          url="https://download.kde.org/stable/plasma/${KWIN_VERSION}/kwin-${KWIN_VERSION}.tar.xz"
          expected_sha="6baa910b732d93c48c90f9c1cc685cc93d0b8de0cdf138c24192c045bc3a48e2"

          curl --fail --location --retry 3 --silent --show-error "$url" --output "$archive"
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum --check --status || {
            echo "::error::KWin archive SHA-256 verification failed."
            exit 1
          }

          mkdir -p "$source_dir"
          tar -xf "$archive" -C "$source_dir"
          test -d "$source_dir/kwin-${KWIN_VERSION}"
          echo "Verified official source archive and extracted kwin-${KWIN_VERSION}."

      - name: Dry-run the native-tiling patch
        shell: bash
        env:
          KWIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/kwin-source/kwin-${KWIN_VERSION}"
          patch --dry-run --batch --forward -d "$source_dir" -Np0 \
            -i "$GITHUB_WORKSPACE/disable-native-tiling.patch"

      - name: Save validation report
        if: always()
        shell: bash
        env:
          KWIN_VERSION: ${{ inputs.kwin_version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "KWin version: $KWIN_VERSION"
            echo "Validation job status: $JOB_STATUS"
            echo "Repository ref: test"
            echo "Scope: official source checksum and patch dry-run only"
            echo "No package was built, no release was created, and no external notifications were sent."
          } > validation-report.txt

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwin-validation-report-${{ inputs.kwin_version }}
          path: validation-report.txt
          if-no-files-found: warn
          retention-days: 14
