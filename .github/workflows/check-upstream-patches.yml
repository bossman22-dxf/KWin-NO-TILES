name: Legacy upstream checker (disabled)

# Deliberately disabled on the test branch. The former workflow used CachyOS
# package discovery and could create GitHub issues/comments, which are not part
# of the current no-contact automation plan. Use validate-kwin-patch.yml for
# manual source-checksum and patch-applicability validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain status
        run: |
          echo "This legacy workflow is intentionally disabled."
          echo "No upstream checks, issues, comments, releases, or notifications were created."
