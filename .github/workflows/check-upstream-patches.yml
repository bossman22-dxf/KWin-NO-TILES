name: Check KWin Patch Against CachyOS

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a recheck of the current KWin package version"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: kwin-upstream-patch-check
  cancel-in-progress: false

env:
  STATE_BRANCH: automation-kwin-version-state
  PACKAGE_BRANCH: verified-kwin-patches

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect new CachyOS KWin package version
        id: detect
        shell: bash
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail

          git clone --quiet --depth 1 \
            https://github.com/CachyOS/Cachyos-pkgbuilds.git cachyos-repo

          PKGBUILD="$(find cachyos-repo -type f \
            -path '*/kwin/PKGBUILD' -print -quit)"

          if [[ -z "$PKGBUILD" ]]; then
            echo "::error::Could not find KWin's PKGBUILD in CachyOS/Cachyos-pkgbuilds."
            exit 1
          fi

          # PKGBUILD metadata is maintained by CachyOS. Source it to obtain
          # the package version and the actual source archive URL.
          source "$PKGBUILD"
          VERSION="${pkgver}-${pkgrel}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          LAST_VERSION=""
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" \
            >/dev/null 2>&1; then
            git fetch --quiet origin "$STATE_BRANCH"
            LAST_VERSION="$(git show \
              "origin/${STATE_BRANCH}:last-checked-version" 2>/dev/null || true)"
          fi

          if [[ "$FORCE" == "true" || "$VERSION" != "$LAST_VERSION" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New KWin package version detected: $VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "KWin $VERSION has already been checked; skipping all further steps."
          fi

      - name: Install required tools
        if: steps.detect.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl patch xz-utils zstd

      - name: Check whether the patch applies
        id: patch_check
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -uo pipefail

          result="error"
          detail="The patch could not be checked because of a setup or source-download error."

          PKGBUILD="$(find cachyos-repo -type f \
            -path '*/kwin/PKGBUILD' -print -quit)"

          if [[ -z "$PKGBUILD" ]]; then
            detail="Could not find KWin's PKGBUILD."
          else
            # Run in a subshell so package functions/variables do not leak.
            if source "$PKGBUILD"; then
              ACTUAL_VERSION="${pkgver}-${pkgrel}"

              if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
                detail="CachyOS package version changed during this workflow run."
              else
                TARBALL_URL=""
                for item in "${source[@]}"; do
                  url="${item#*::}"
                  filename="${item%%::*}"
                  if [[ "$url" == *"kwin-${pkgver}.tar."* ]] || \
                     [[ "$filename" == "kwin-${pkgver}.tar."* ]]; then
                    TARBALL_URL="$url"
                    break
                  fi
                done

                if [[ -z "$TARBALL_URL" ]]; then
                  detail="Could not identify the KWin source archive from the PKGBUILD source array."
                elif ! curl --fail --location --retry 3 \
                    --silent --show-error "$TARBALL_URL" \
                    --output "$RUNNER_TEMP/kwin-source.tar"; then
                  detail="Failed to download KWin source from the URL declared by the PKGBUILD."
                elif ! mkdir -p "$RUNNER_TEMP/kwin-source" || \
                     ! tar -xf "$RUNNER_TEMP/kwin-source.tar" \
                       -C "$RUNNER_TEMP/kwin-source"; then
                  detail="Downloaded KWin source archive could not be extracted."
                else
                  SOURCE_DIR="$(find "$RUNNER_TEMP/kwin-source" \
                    -mindepth 1 -maxdepth 1 -type d -print -quit)"

                  if [[ -z "$SOURCE_DIR" ]]; then
                    detail="No source directory found in the KWin archive."
                  elif [[ ! -f "$GITHUB_WORKSPACE/disable-native-tiling.patch" ]]; then
                    detail="disable-native-tiling.patch was not found at the repository root."
                  else
                    # The patch headers use paths like src/window.cpp;
                    # -p0 therefore matches the patch's path layout.
                    if patch --dry-run --batch --forward \
                      -d "$SOURCE_DIR" -Np0 \
                      -i "$GITHUB_WORKSPACE/disable-native-tiling.patch"; then
                      result="pass"
                      detail="disable-native-tiling.patch applies cleanly to KWin ${EXPECTED_VERSION}."
                    else
                      result="fail"
                      detail="disable-native-tiling.patch does not apply cleanly to KWin ${EXPECTED_VERSION}."
                    fi
                  fi
                fi
              fi
            else
              detail="Failed to load the KWin PKGBUILD."
            fi
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo "detail<<KWINDIAG"
            echo "$detail"
            echo "KWINDIAG"
          } >> "$GITHUB_OUTPUT"

          echo "KWin version: $EXPECTED_VERSION"
          echo "Patch check result: $result"
          echo "$detail"

      - name: Preserve patch for packaging
        if: steps.detect.outputs.changed == 'true' && steps.patch_check.outputs.result == 'pass'
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/disable-native-tiling.patch" "$RUNNER_TEMP/disable-native-tiling.patch"

      - name: Record definitively checked version
        if: steps.detect.outputs.changed == 'true' && (steps.patch_check.outputs.result == 'pass' || steps.patch_check.outputs.result == 'fail')
        shell: bash
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" \
            >/dev/null 2>&1; then
            git fetch --quiet origin "$STATE_BRANCH"
            git switch --quiet --force-create "$STATE_BRANCH" "origin/$STATE_BRANCH"
          else
            git switch --quiet --orphan "$STATE_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          printf '%s\n' "$VERSION" > last-checked-version
          git add last-checked-version

          if ! git diff --cached --quiet; then
            git commit -m "Record checked KWin version $VERSION"
            git push origin "$STATE_BRANCH"
          fi

      - name: Package patch for the personal branch
        id: package
        if: steps.detect.outputs.changed == 'true' && steps.patch_check.outputs.result == 'pass'
        shell: bash
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail

          # Save the patch before switching to the orphan/packaging branch.
          PACKAGE_DIR="$RUNNER_TEMP/kwin-patch-package"
          mkdir -p "$PACKAGE_DIR"
          cp "$RUNNER_TEMP/disable-native-tiling.patch" "$PACKAGE_DIR/disable-native-tiling.patch"

          cat > "$PACKAGE_DIR/README.txt" <<EOF
          KWin native tiling patch
          CachyOS package version: $VERSION
          Patch applicability check: PASSED
          Check type: patch --dry-run against the source archive declared by
          the CachyOS KWin PKGBUILD.
          Note: This confirms patch applicability only; it is not a full build
          or runtime test.
          EOF

          tar -czf "$RUNNER_TEMP/kwin-patch-${VERSION}.tar.gz" \
            -C "$PACKAGE_DIR" .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$PACKAGE_BRANCH" \
            >/dev/null 2>&1; then
            git fetch --quiet origin "$PACKAGE_BRANCH"
            git switch --quiet --force-create "$PACKAGE_BRANCH" "origin/$PACKAGE_BRANCH"
          else
            git switch --quiet --orphan "$PACKAGE_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p packages
          cp "$RUNNER_TEMP/kwin-patch-${VERSION}.tar.gz" "packages/kwin-patch-${VERSION}.tar.gz"
          cp "$PACKAGE_DIR/README.txt" "packages/README-${VERSION}.txt"

          git add packages
          if ! git diff --cached --quiet; then
            git commit -m "Add verified KWin patch bundle for $VERSION"
            git push origin "$PACKAGE_BRANCH"
          else
            echo "The same versioned bundle is already present on $PACKAGE_BRANCH."
          fi

      - name: Notify about the new version
        if: always() && steps.detect.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          RESULT: ${{ steps.patch_check.outputs.result }}
          DETAIL: ${{ steps.patch_check.outputs.detail }}
          PUBLISH_OUTCOME: ${{ steps.package.outcome }}
        with:
          script: |
            const version = process.env.VERSION;
            const result = process.env.RESULT || "error";
            const detail = process.env.DETAIL || "No diagnostic details were provided.";
            const publishOutcome = process.env.PUBLISH_OUTCOME || "skipped";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const titles = {
              pass: `KWin ${version}: patch applies`,
              fail: `KWin ${version}: patch conflict`,
              error: `KWin ${version}: patch check needs attention`
            };

            const body = [
              `A new CachyOS KWin package version was detected: **${version}**.`,
              "",
              `**Result:** ${result.toUpperCase()}`,
              "",
              detail,
              "",
              result === "pass"
                ? (publishOutcome === "success"
                    ? "The version-labelled bundle was published to the `verified-kwin-patches` branch."
                    : `The patch applies, but publishing the bundle did not complete successfully (step outcome: ${publishOutcome}). Check the workflow logs.`)
                : result === "fail"
                  ? "No package was published because the patch did not apply."
                  : "The version was not recorded as checked, so the scheduled workflow will retry it.",
              "",
              `Workflow run: ${runUrl}`
            ].join("\n");

            const title = titles[result] || titles.error;
            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const existing = openIssues.data.find(issue =>
              !issue.pull_request && issue.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Fail workflow if the patch check could not be completed
        if: steps.detect.outputs.changed == 'true' && steps.patch_check.outputs.result == 'error'
        run: |
          echo "::error::Patch check could not be completed. See the issue created by the notification step."
          exit 1
